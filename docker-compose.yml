version: '3.8'

services:
  # The Node.js Backend API
  api:
    build: .
    container_name: gks_fitness_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      # 🔥 Added ?replicaSet=rs0 for transaction support
      - MONGO_URI=mongodb://mongo:27017/gks_fitness_shop?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - SWAGGER_URL=http://localhost:5000
      # 🔥 FIXED: Now dynamically pulls from your .env file
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # 🔥 NEW: Missing variables added
      - SENTRY_DSN=${SENTRY_DSN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - mongo
    networks:
      - fitness_network

  # The MongoDB Database
  mongo:
    image: mongo:latest
    container_name: gks_fitness_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fitness_network
    # 🔥 CRITICAL FIX: Forces Mongo into Replica Set mode
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

networks:
  fitness_network:
    driver: bridge

volumes:
  mongo_data: